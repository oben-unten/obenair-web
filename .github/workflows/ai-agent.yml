name: AI Issue Agent

on:
  issues:
    types: [labeled]

jobs:
  ai-fix:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI Agent (Aider)
        run: pip install aider-chat

      - name: Run AI Agent on Issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Create a unique branch name (Issue Number + Workflow Run ID)
          BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          # 3. Run AI agent (--no-auto-commits lets us manage the commit)
          aider --model gemini/gemini-2.5-pro \
                --no-auto-commits \
                --message "Fix this issue: Title: '${{ github.event.issue.title }}'. Description: '${{ github.event.issue.body }}'" \
                --yes-always

          # 4. Commit and push changes if any were made
          git add .
          if git diff --cached --quiet; then
            echo "No changes made by AI."
          else
            git commit -m "AI fix for issue #${{ github.event.issue.number }}"
            git push origin $BRANCH_NAME

            # 5. Open a Pull Request on GitHub
            gh pr create --title "AI Fix: ${{ github.event.issue.title }}" \
                         --body "Automated resolution for Issue #${{ github.event.issue.number }} created using Gemini." \
                         --head $BRANCH_NAME
          fi
