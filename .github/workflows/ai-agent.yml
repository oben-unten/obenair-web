name: AI Issue Agent

on:
  issues:
    types: [labeled]

jobs:
  ai-fix:
    if: github.event.label.name == 'ai-fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Gemini CLI on Issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        run: |
          # 1. Configure Git identity
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 2. Create a unique branch name
          BRANCH_NAME="ai-fix-issue-${{ github.event.issue.number }}-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          # 3. Run Gemini CLI non-interactively with workspace trust bypass
          npx @google/gemini-cli -p "Fix this issue: Title: '${{ github.event.issue.title }}'. Description: '${{ github.event.issue.body }}'" --yolo --skip-trust

          # 4. Commit and push changes if any were made
          git add .
          if git diff --cached --quiet; then
            echo "No changes made by AI."
          else
            git commit -m "AI fix for issue #${{ github.event.issue.number }}"
            git push origin $BRANCH_NAME

            # 5. Open a Pull Request on GitHub
            gh pr create --title "AI Fix: ${{ github.event.issue.title }}" \
                         --body "Automated resolution for Issue #${{ github.event.issue.number }} created using Gemini CLI." \
                         --head $BRANCH_NAME
          fi
